site_name: Politica e Governanca de IA
site_description: Documentacao estrategica sobre governanca de IA, evolucao tecnologica e uso responsavel de IA
site_url: https://filsduvent.github.io/ai-governance-docs/
repo_url: https://github.com/Filsduvent/ai-governance-docs
repo_name: Filsduvent/ai-governance-docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: pt

nav:
  - Inicio: index.md
  - Contexto: contexto.md
  - Evolucao da Tecnologia: evolucao-tecnologia.md
  - Uso sem Governanca: uso-sem-governanca.md
  - Uso com Governanca: uso-com-governanca.md
  - Politica de IA: politica-ia.md
  - Referencias: referencias.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Nesta pagina
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
